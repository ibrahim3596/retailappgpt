name: Android CI

permissions:
  contents: write

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Grant execute permission
      run: chmod +x ./gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug --stacktrace

    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest --stacktrace

    # Instrumentation tests require an emulator/device which is not available in standard GitHub Actions.
    # These are expected to pass on a developer machine with an emulator or physical device.
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-results
        path: app/build/test-results/testDebugUnitTest/
        if-no-files-found: ignore

    - name: Upload debug APK
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: ignore
    - name: Publish debug APK to repository
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        cp app/build/outputs/apk/debug/*.apk app-debug.apk
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add app-debug.apk
        if git diff --cached --quiet; then
          echo "APK unchanged; nothing to commit"
        else
          git commit -m "build: publish latest debug APK [skip ci]"
          git push
        fi

