name: Backend CI

on:
  push:
    branches: [ "main", "dev/**" ]
  pull_request:
    branches: [ "main" ]

defaults:
  run:
    working-directory: server

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test
