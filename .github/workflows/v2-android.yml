name: RetailPOS V2 Android CI

on:
  push:
    branches: ["retailpos-v2", "retailpos-v2-dev"]
  pull_request:
    branches: ["retailpos-v2"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Run KSP
        run: gradle :app:kspDebugKotlin

      - name: Compile Kotlin
        run: gradle :app:compileDebugKotlin

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest

      - name: Run lint
        run: gradle :app:lintDebug

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Verify debug APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk
